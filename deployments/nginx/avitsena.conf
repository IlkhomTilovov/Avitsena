# Domensiz, IP:port orqali ishlaydigan vaqtinchalik konfiguratsiya.
# Domen qo'shilganda: server_name ni to'ldiring, listen 80/443 ga o'tkazing,
# va certbot bilan SSL qo'shing (steelwood.conf namunasidagi kabi).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 25m;

    root /var/www/avitsena/dist;
    index index.html;

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard/control-center {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/avitsena/backend/staticfiles/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /media/ {
        alias /opt/avitsena/backend/media/;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
